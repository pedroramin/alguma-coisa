<!doctype html><html lang='pt-BR'><head><meta charset='UTF-8'/><meta name='viewport' content='width=device-width, initial-scale=1.0'/><title>Upsell | Calculadora Mensal do Motorista</title><link rel='stylesheet' href='styles.css'/></head><body><main class='container'><section class='card final-cta'><h1>Agora que você aprendeu o controle, quer calcular seu lucro automaticamente todo mês?</h1><p>Com a Calculadora Mensal do Motorista, você coloca seus números e descobre em segundos quanto realmente sobrou.</p><p class='price'><span>Oferta única:</span> <strong>R$ 27,00</strong></p><div class='actions'><button class='btn'>Sim, quero adicionar a calculadora</button><a class='btn ghost' href='index.html'>Não, obrigado. Quero apenas o ebook.</a></div></section>
<section class='card'><h2>Calculadora Mensal do Motorista</h2><form id='calcForm' class='grid-2'>
<label>Ganho bruto do mês (R$)<input name='gross' type='number' step='0.01' required></label>
<label>Combustível (R$)<input name='fuel' type='number' step='0.01' required></label>
<label>Manutenção (R$)<input name='maint' type='number' step='0.01' required></label>
<label>Lavagem (R$)<input name='wash' type='number' step='0.01' required></label>
<label>Alimentação (R$)<input name='food' type='number' step='0.01' required></label>
<label>Estacionamento (R$)<input name='park' type='number' step='0.01' required></label>
<label>Seguro (R$)<input name='ins' type='number' step='0.01' required></label>
<label>IPVA/licenciamento (R$)<input name='ipva' type='number' step='0.01' required></label>
<label>Financiamento/aluguel (R$)<input name='car' type='number' step='0.01' required></label>
<label>Quilômetros rodados<input name='km' type='number' step='0.01' required></label>
<label>Dias trabalhados<input name='days' type='number' step='1' required></label>
<label>Horas trabalhadas<input name='hours' type='number' step='0.01' required></label>
</form><div class='actions'><button class='btn' id='calcBtn'>Calcular meu lucro</button><button class='btn ghost' id='clearBtn'>Limpar dados</button></div><p id='error' class='error'></p><div id='results' class='grid-3'></div></section></main><script src='script.js'></script></body></html>
